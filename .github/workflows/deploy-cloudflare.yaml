name: Deploy to Cloudflare Workers

# 手动触发，只负责发布。构建校验已并入 ci.yaml（npm run build:cf），本工作流不再提供只构建模式。
# 所需仓库 Secrets：
#   CF_API_TOKEN   —— Cloudflare API Token，权限 Workers Scripts:Edit（+ 账户读）
#   CF_ACCOUNT_ID  —— Cloudflare 账户 ID
# 运行时变量/密钥（Cookie、Turso、SETTINGS_API_KEY 等）用 `npx wrangler secret put <NAME>`
# 或 Dashboard 注入，不经过本工作流。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy (workerd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 自带 npm 10（锁文件按此生成）
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext bundle
        run: npm run build:cf

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
