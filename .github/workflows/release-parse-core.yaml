name: Release parse-core

on:
  push:
    tags:
      - "parse-core-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-parse-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish parse-core tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/parse-core-v}"
          PKG_VERSION=$(node -p "require('./packages/parse-core/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build parse-core
        working-directory: packages/parse-core
        run: |
          npm install
          npm run build

      - name: Run tests
        run: npm test

      - name: Pack tarball
        working-directory: packages/parse-core
        run: npm pack --ignore-scripts

      - name: Compute SHA-256
        working-directory: packages/parse-core
        run: |
          TARBALL=$(ls mediaget-parse-core-*.tgz | head -1)
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "parse-core v${{ env.TARBALL }}"
          body: |
            Auto-generated release for @mediaget/parse-core v${{ env.TARBALL }}.

            **Installation:**
            ```json
            {
              "@mediaget/parse-core": "https://github.com/hotier/mediaGet/releases/download/parse-core-v${{ env.TARBALL }}/mediaget-parse-core-${{ env.TARBALL }}.tgz"
            }
            ```

            **SHA-256 checksum:** See attached .sha256 file.
          files: |
            packages/parse-core/${{ env.TARBALL }}
            packages/parse-core/${{ env.TARBALL }}.sha256
          draft: false
          prerelease: false
