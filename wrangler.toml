# Cloudflare Workers 部署配置（OpenNext 官方方案）
#
# 构建：npm run build:cf   → 产出 .open-next/worker.js + .open-next/assets
# 本地：npm run preview:cf → 用 workerd 跑真实 Workers 运行时（不是 next dev）
# 上线：npm run deploy:cf（或 GitHub Actions 的 deploy-cloudflare.yaml）
# Workers Builds（Git 集成）亦可：Build command = npm run build:cf，Deploy command = npx wrangler deploy
name = "hotier-parse"
main = ".open-next/worker.js"

# 兼容日期按「内核实际用到的 Node API」取：
# - 2025-08-15 起 node:http(s) 客户端随 nodejs_compat 自动启用（抖音 DoH 兜底用 node:https）
# - 2026-03-17 起 workerd 提供 child_process 桩（可导入、调用即抛，TikTok 据此给出明确降级提示）
# 降低日期会分别丢掉这两项；调高无额外依赖，故锁定到最新所需日期。
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# OpenNext 的缓存清理 / 再验证需要回源到自身（无 ISR 时仅作兜底，不影响解析主链路）
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "hotier-parse"

# wrangler dev / deploy 的请求日志（Workers Logs）
[observability]
enabled = true

# 非敏感环境变量。敏感值（Cookie / Turso Token / SETTINGS_API_KEY 等）
# 用 `npx wrangler secret put <NAME>` 写入，或用 Dashboard 的 Variables and Secrets，
# 不写入本文件。完整清单见 CLAUDE.md「环境变量」。
[vars]
BILIBILI_USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
# 功能开关：视频解析入口（/api/config 读取；值为 "true" 时放开）
VIDEO_PARSE_ENABLED = "true"

# 自定义域名示例（按需启用）
# [[routes]]
# pattern = "parse.example.com"
# custom_domain = true
